<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>ASN Donate Tiers Overlay (Blinking Neon)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  * {
    box-sizing: border-box;
  }

  .overlay-wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: blink 0.6s steps(1, end) infinite;
  }

  /* Hollow neon text: transparent fill, visible only via stroke + glow */
  .donate-line {
    font-family: 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: transparent;
    -webkit-text-stroke: 1.3px rgba(150, 210, 255, 0.95);
    text-shadow:
      0 0 6px rgba(100, 180, 255, 0.95),
      0 0 14px rgba(120, 90, 255, 0.9),
      0 0 26px rgba(150, 70, 255, 0.75),
      0 0 42px rgba(90, 150, 255, 0.5);
    text-align: center;
  }

  /*
    Fast, repeating neon-sign-style blink.
    Loop = 0.6s: visible most of the cycle, then a quick off-flicker,
    giving a "flashing neon sign" look rather than a slow fade.
  */
  @keyframes blink {
    0%   { opacity: 1; }
    65%  { opacity: 1; }
    70%  { opacity: 0.15; }
    75%  { opacity: 1; }
    80%  { opacity: 0.1; }
    85%  { opacity: 1; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="overlay-wrap">
  <div class="overlay" id="overlay">
    <span class="donate-line">Донат від 100 грн - молік в тімейта</span>
    <span class="donate-line">Донат від 200 грн - вихід з катки</span>
  </div>
</div>

<script>
  // Animation loops via CSS (infinite). This just guards against streaming
  // browser-source engines pausing CSS animations on initial load.
  window.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('overlay');
    if (el) {
      el.style.animation = 'none';
      void el.offsetWidth; // force reflow
      el.style.animation = '';
    }
  });
</script>

</body>
</html>
